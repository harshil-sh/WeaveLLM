name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore WeaveLLM.sln

      - name: Build
        run: dotnet build WeaveLLM.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test WeaveLLM.sln --no-build --configuration Release --verbosity normal

  pack:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack WeaveLLM.Core
        run: dotnet pack src/WeaveLLM.Core/WeaveLLM.Core.csproj --configuration Release --output ./nupkgs

      - name: Pack WeaveLLM.Providers
        run: dotnet pack src/WeaveLLM.Providers/WeaveLLM.Providers.csproj --configuration Release --output ./nupkgs

      - name: Pack WeaveLLM.Extensions.DependencyInjection
        run: dotnet pack src/WeaveLLM.Extensions.DependencyInjection/WeaveLLM.Extensions.DependencyInjection.csproj --configuration Release --output ./nupkgs

      - name: Pack WeaveLLM.Observability
        run: dotnet pack src/WeaveLLM.Observability/WeaveLLM.Observability.csproj --configuration Release --output ./nupkgs

      - name: Upload NuGet packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./nupkgs/*.nupkg
  publish:
    runs-on: ubuntu-latest
    needs: build
    # Only publish when you push a version tag like v0.1.0
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and Pack
        run: |
          dotnet restore WeaveLLM.sln
          dotnet build WeaveLLM.sln -c Release --no-restore
          dotnet pack src/WeaveLLM.Core/WeaveLLM.Core.csproj -c Release -o ./nupkgs
          dotnet pack src/WeaveLLM.Providers/WeaveLLM.Providers.csproj -c Release -o ./nupkgs
          dotnet pack src/WeaveLLM.Extensions.DependencyInjection/WeaveLLM.Extensions.DependencyInjection.csproj -c Release -o ./nupkgs
          dotnet pack src/WeaveLLM.Observability/WeaveLLM.Observability.csproj -c Release -o ./nupkgs

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
